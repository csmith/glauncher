name: vuln check 

on:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: read

jobs:
  build:
    uses: meta/workflows/.forgejo/workflows/go-vulncheck.yml@master
    runs-on: docker
    with:
      apt_packages: >-
        gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev
        libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev
        libffi-dev libxcursor-dev libvulkan-dev
